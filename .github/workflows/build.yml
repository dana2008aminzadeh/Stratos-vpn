name: Build Stratos VPN APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - master
      - 'arena/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;29.0.14206865"
        echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        sed -i '10i\
        \
            ndkVersion = "29.0.14206865"' ${{ github.workspace }}/V2rayNG/app/build.gradle.kts

    - name: Restore cached libhevtun
      id: cache-libhevtun-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Build libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      run: |
        bash compile-hevtun.sh

    - name: Save libhevtun
      if: steps.cache-libhevtun-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/libs
        key: libhevtun-${{ runner.os }}-${{ env.NDK_HOME }}-${{ hashFiles('.git/modules/hev-socks5-tunnel/HEAD') }}-${{ hashFiles('compile-hevtun.sh') }}

    - name: Copy libhevtun
      run: |
        cp -r ${{ github.workspace }}/libs ${{ github.workspace }}/V2rayNG/app

    - name: Fetch AndroidLibXrayLite tag
      run: |
        pushd AndroidLibXrayLite
        CURRENT_TAG=$(git describe --tags --abbrev=0)
        echo "Current tag in this repo: $CURRENT_TAG"
        echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
        popd

    - name: Download libv2ray
      uses: robinraju/release-downloader@v1.13
      with:
        repository: '2dust/AndroidLibXrayLite'
        tag: ${{ env.CURRENT_TAG }}
        fileName: 'libv2ray.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Download Lightway AAR
      uses: robinraju/release-downloader@v1.13
      with:
        repository: 'expressvpn/lightway'
        tag: 'lightway-nightly'
        fileName: 'lightway-release.aar'
        out-file-path: V2rayNG/app/libs/

    - name: Setup Go (dnstt client)
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Build dnstt client binaries
      # dnstt-client is packaged as libdnsttclient.so per ABI: Android only extracts
      # executable helpers from the native library dir (W^X policy) and only accepts
      # the lib*.so naming there in release builds. Pinned mirror commit for
      # reproducibility; source: https://www.bamsoftware.com/git/dnstt.git
      run: |
        set -uo pipefail
        echo "::notice title=Go toolchain::$(go version)"
        SHA=f1b9b97a269f83bad41d2ceef291b4d2c161cd11
        if ! curl -fsSL "https://github.com/tladesignz/dnstt/archive/${SHA}.tar.gz" | tar xz; then
          echo "::error title=dnstt archive::failed to download or extract the pinned source archive"
          exit 1
        fi
        cd "dnstt-${SHA}" || { echo "::error title=dnstt source::directory dnstt-${SHA} missing after extraction"; exit 1; }
        if ! out=$(go mod download 2>&1); then
          echo "::error title=go mod download::${out}"
          exit 1
        fi
        mkdir -p ../V2rayNG/app/libs/arm64-v8a ../V2rayNG/app/libs/armeabi-v7a ../V2rayNG/app/libs/x86_64
        if ! out=$(GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../V2rayNG/app/libs/arm64-v8a/libdnsttclient.so ./dnstt-client 2>&1); then
          echo "::error title=dnstt build arm64-v8a::${out}"
          exit 1
        fi
        # android/arm requires external (cgo) linking for the PIE the platform
        # mandates, so the 32-bit build goes through the NDK clang driver (already
        # installed for the app build) instead of the pure-Go linker.
        NDK_CLANG="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang"
        if [ ! -x "$NDK_CLANG" ]; then
          echo "::error title=dnstt build armeabi-v7a::NDK clang not found at $NDK_CLANG"
          exit 1
        fi
        if ! out=$(GOOS=android GOARCH=arm GOARM=7 CGO_ENABLED=1 CC="$NDK_CLANG" go build -trimpath -ldflags="-s -w" -o ../V2rayNG/app/libs/armeabi-v7a/libdnsttclient.so ./dnstt-client 2>&1); then
          echo "::error title=dnstt build armeabi-v7a::${out}"
          exit 1
        fi
        # android/amd64 also requires external (cgo) linking — same NDK driver as above
        NDK_CLANG_X64="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
        if [ ! -x "$NDK_CLANG_X64" ]; then
          echo "::error title=dnstt build x86_64::NDK clang not found at $NDK_CLANG_X64"
          exit 1
        fi
        if ! out=$(GOOS=android GOARCH=amd64 CGO_ENABLED=1 CC="$NDK_CLANG_X64" go build -trimpath -ldflags="-s -w" -o ../V2rayNG/app/libs/x86_64/libdnsttclient.so ./dnstt-client 2>&1); then
          echo "::error title=dnstt build x86_64::${out}"
          exit 1
        fi
        ls -la ../V2rayNG/app/libs/*/libdnsttclient.so

    - name: Setup Java
      uses: actions/setup-java@v6.0.1
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Prepare signing keystore
      env:
        KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        KS_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        KS_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        KEY_PASS: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        if [ -n "$KS_B64" ]; then
          echo "Using release keystore from secrets"
          echo "$KS_B64" | base64 -d > android_keystore.jks
          echo "KS_STORE_PASSWORD=$KS_PASS" >> $GITHUB_ENV
          echo "KS_ALIAS=$KS_ALIAS" >> $GITHUB_ENV
          echo "KS_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
        else
          echo "No signing secrets configured - generating a temporary debug keystore"
          keytool -genkeypair -v \
            -keystore android_keystore.jks \
            -alias stratos-debug -storepass stratos123 -keypass stratos123 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Stratos VPN Debug, OU=Dev, O=Stratos, C=NL"
          echo "KS_STORE_PASSWORD=stratos123" >> $GITHUB_ENV
          echo "KS_ALIAS=stratos-debug" >> $GITHUB_ENV
          echo "KS_KEY_PASSWORD=stratos123" >> $GITHUB_ENV
          echo "DEBUG_KEYSTORE_USED=true" >> $GITHUB_ENV
        fi

    - name: Prepare Gradle
      run: |
        cd ${{ github.workspace }}/V2rayNG
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew

    - name: Run unit tests
      run: |
        cd ${{ github.workspace }}/V2rayNG
        if out=$(./gradlew --no-daemon :app:testPlaystoreDebugUnitTest 2>&1); then
          echo "$out" | tail -n 25
        else
          status=$?
          echo "$out" | tail -n 250
          echo "::error title=Unit tests::gradlew :app:testPlaystoreDebugUnitTest failed (exit $status)"
          # GitHub caps annotations per step at ten — highest value first:
          # assertion messages, then failing test names, then fatal Gradle errors.
          printf '%s\n' "$out" | awk '
            /^e: / { print; if (++n >= 9) exit; next }
            /FAILED$/ { print; c = 2; if (++n >= 9) exit; next }
            c > 0 && /^[[:space:]]+(at |java\.|kotlin\.|org\.junit)/ { print; c--; n++; next }
            /^FAILURE:/ { if (++n >= 9) exit; print; next }
            /\* What went wrong:/ { if (++n >= 9) exit; print; next }
          ' | head -n 9 | while IFS= read -r line; do
            printf '::error title=Test failure::%s\n' "${line:0:400}"
          done
          exit 1
        fi

    - name: Build APK
      run: |
        cd ${{ github.workspace }}/V2rayNG
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=${{ github.workspace }}/android_keystore.jks \
          -Pandroid.injected.signing.store.password=${{ env.KS_STORE_PASSWORD }} \
          -Pandroid.injected.signing.key.alias=${{ env.KS_ALIAS }} \
          -Pandroid.injected.signing.key.password=${{ env.KS_KEY_PASSWORD }}

    - name: Upload arm64-v8a APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: StratosVPN-arm64-v8a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*arm64-v8a*.apk

    - name: Upload armeabi-v7a APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: StratosVPN-armeabi-v7a
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*armeabi-v7a*.apk

    - name: Upload x86_64 APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: StratosVPN-x86_64
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*x86_64*.apk

    - name: Upload universal APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: StratosVPN-universal
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/*/release/*universal*.apk

  sign-and-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          path: release

      - name: Sign APK files
        run: |
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
          mkdir -p release-files

          find release -type f -name '*.apk' | while read apk; do
            cp "$apk" release-files/
            gpg --batch --yes --local-user "$KEY" --detach-sign --output "release-files/$(basename "$apk").sig" "$apk"
          done

      - name: Upload APKs and signatures to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: release-files/*
          tag: ${{ inputs.release_tag }}
          file_glob: true
          prerelease: true
